# SalesKnot production stack for a small VPS (2 CPU / 4 GB RAM is enough).
# Database: its own Postgres container on the VPS (default), or Neon (set PG_DATABASE_URL and
# remove `localdb` from COMPOSE_PROFILES). Public access: Cloudflare Tunnel (no open ports needed).
name: salesknot

x-app: &app
  build: .
  image: salesknot:${TWENTY_VERSION:-v2.46.0}
  restart: unless-stopped
  volumes:
    - local-storage:/app/packages/twenty-server/.local-storage
  env_file: .env           # passes only the settings you filled in (empty optional ones would fail validation)
  environment: &app-env
    REDIS_URL: redis://redis:6379
    LOGIC_FUNCTION_TYPE: LOCAL   # lets industry packs run their automations
  depends_on:
    redis:
      condition: service_healthy
    db:
      condition: service_healthy
      required: false   # skipped when using Neon

services:
  server:
    <<: *app
    ports:
      - "127.0.0.1:3100:3000"   # VPS-only (port 3100 avoids clashing with other apps); the tunnel uses server:3000
    healthcheck:
      test: curl --fail http://localhost:3000/healthz
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15m   # first start sets up the database and can be slow

  worker:
    <<: *app
    command: ["yarn", "worker:prod"]
    environment:
      <<: *app-env
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
    depends_on:
      server:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    profiles: ["localdb"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: salesknot
      POSTGRES_USER: salesknot
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: pg_isready -U salesknot -d salesknot
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  web:   # marketing page on salesknot.app/, everything else passed to the server
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./landing/public:/usr/share/nginx/html:ro
      - ./landing/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      server:
        condition: service_healthy

volumes:
  local-storage:
  db-data:
