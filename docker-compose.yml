# SalesKnot production stack for a small VPS (2 CPU / 4 GB RAM is enough).
# Database: Neon (external). Public access: Cloudflare Tunnel (no open ports needed).
name: salesknot

x-app: &app
  build: .
  image: salesknot:${TWENTY_VERSION:-v2.46.0}
  restart: unless-stopped
  volumes:
    - local-storage:/app/packages/twenty-server/.local-storage
  environment: &app-env
    PG_DATABASE_URL: ${PG_DATABASE_URL}
    SERVER_URL: ${SERVER_URL}
    REDIS_URL: redis://redis:6379
    ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    STORAGE_TYPE: ${STORAGE_TYPE:-local}
    STORAGE_S3_REGION: ${STORAGE_S3_REGION:-}
    STORAGE_S3_NAME: ${STORAGE_S3_NAME:-}
    STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
    STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID:-}
    STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY:-}
    EMAIL_DRIVER: ${EMAIL_DRIVER:-}
    EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
    EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-SalesKnot}
    EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
    EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-}
    EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
    EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
  depends_on:
    redis:
      condition: service_healthy

services:
  server:
    <<: *app
    ports:
      - "127.0.0.1:3000:3000"   # only reachable on the VPS itself; the tunnel publishes it
    healthcheck:
      test: curl --fail http://localhost:3000/healthz
      interval: 10s
      timeout: 5s
      retries: 30

  worker:
    <<: *app
    command: ["yarn", "worker:prod"]
    environment:
      <<: *app-env
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
    depends_on:
      server:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      server:
        condition: service_healthy

volumes:
  local-storage:
