# salesknot.app: the marketing site is served from ./public, everything else
# (sign-in, API, file uploads, webhooks) is passed through to SalesKnot.

# two-letter country code from Cloudflare's CF-IPCountry header, anything else becomes XX
map $http_cf_ipcountry $sk_country { "~^[A-Z]{2}$" $http_cf_ipcountry; default "XX"; }
# first label of the host name, e.g. "legal-law" for legal-law.salesknot.app (coming-soon pages below)
map $host $sk_sub { "~^(?<label>[a-z0-9-]+)\." $label; default ""; }

server {
  listen 80;
  resolver 127.0.0.11 valid=30s;
  set $app http://server:3000;
  client_max_body_size 100m;
  root /usr/share/nginx/html;
  absolute_redirect off;

  location = / { try_files /index.html =404; add_header Cache-Control "public, max-age=300"; }

  # visitor's country from Cloudflare (CF-IPCountry), used to show PKR prices in Pakistan
  location = /_geo {
    default_type application/json;
    add_header Cache-Control "private, no-store" always;
    return 200 '{"c":"$sk_country"}';
  }

  # marketing pages
  location ~ ^/(features|editions|pricing|faq|about)(/.*)?$ {
    rewrite ^(/(features|editions|pricing|faq|about)(/[a-z0-9-]+)?)$ $1/ permanent;
    try_files $uri $uri/index.html =404;
    error_page 404 /404.html;
    add_header Cache-Control "public, max-age=300";
  }
  location ^~ /_site/ { add_header Cache-Control "public, max-age=604800"; try_files $uri =404; }
  location = /404.html { internal; }
  location ~ ^/(robots\.txt|sitemap\.xml|favicon\.ico|favicon\.svg|apple-touch-icon\.png|site\.webmanifest)$ {
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  # demo bookings and 7-day magic links (the demo service)
  location ^~ /demo/ {
    set $demo http://demo:8080;
    proxy_pass $demo;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  # everything else goes to the CRM
  location / {
    proxy_pass $app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }
}

# Editions that aren't built yet: their subdomains show a "coming soon" page.
# Needs a Cloudflare Tunnel public hostname for each, pointing at http://web:80, listed above *.salesknot.app.
server {
  listen 80;
  server_name legal-law.salesknot.app import-export.salesknot.app;
  root /usr/share/nginx/html;
  absolute_redirect off;

  location = / {
    add_header Cache-Control "public, max-age=300";
    try_files /soon/$sk_sub.html =404;
  }
  location ^~ /_site/ { add_header Cache-Control "public, max-age=604800"; try_files $uri =404; }
  location ~ ^/(favicon\.ico|favicon\.svg|apple-touch-icon\.png|site\.webmanifest)$ { try_files $uri =404; }
  # every other link on the page goes to the main site
  location / { return 302 https://salesknot.app$request_uri; }
}
